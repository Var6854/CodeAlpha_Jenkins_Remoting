plugins {
    id 'java'
    id 'application'
}

group = 'com.codealpha.remoting'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
    }
}

application {
    mainClass = 'com.codealpha.remoting.RemotingApp'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.codealpha.remoting.RemotingApp',
            'Implementation-Title': 'CodeAlpha Distributed Build Application',
            'Implementation-Version': project.version,
            'Built-By': System.getProperty('user.name')
        )
    }
    archiveBaseName = 'CodeAlpha-Remoting-App'
}
